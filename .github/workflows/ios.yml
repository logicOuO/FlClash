name: iOS build validation
on:
  workflow_dispatch:
  push:
    branches: ['codex/ios-*']
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unsigned-device:
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: core/go.sum
      - name: Install native tools
        run: |
          xcodebuild -version
          brew install xcodegen
          rustup show
        working-directory: plugins/rust_api/rust
      - name: Prepare iOS project
        run: bash tool/prepare_ios.sh
      - name: Build without signing
        run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          mkdir -p build/ios/package/Payload
          ditto build/ios/iphoneos/Runner.app build/ios/package/Payload/Runner.app
          cd build/ios/package
          zip -qry ../FlClash-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: FlClash-ios-unsigned
          path: build/ios/FlClash-unsigned.ipa
          if-no-files-found: error
