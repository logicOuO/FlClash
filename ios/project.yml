name: Runner
options:
  bundleIdPrefix: com.follow
  deploymentTarget:
    iOS: '15.0'
configs:
  Debug: debug
  Profile: release
  Release: release
settings:
  base:
    SWIFT_VERSION: '5.0'
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    FLCLASH_BUNDLE_ID: com.follow.flclash
    FLCLASH_APP_GROUP: group.$(FLCLASH_BUNDLE_ID)
    CODE_SIGN_STYLE: Automatic
    HEADER_SEARCH_PATHS: $(inherited) $(SRCROOT)/../libclash/ios/$(PLATFORM_NAME) $(SRCROOT)/../core
    LIBRARY_SEARCH_PATHS: $(inherited) $(SRCROOT)/../libclash/ios/$(PLATFORM_NAME)
    OTHER_LDFLAGS: $(inherited) -lclash -lresolv
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  Runner:
    type: application
    platform: iOS
    sources:
      - path: Runner
        excludes: ['Info.plist', '*.entitlements']
      - Shared
    configFiles:
      Debug: Flutter/Debug.xcconfig
      Profile: Flutter/Release.xcconfig
      Release: Flutter/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FLCLASH_BUNDLE_ID)
        INFOPLIST_FILE: Runner/Info.plist
        CODE_SIGN_ENTITLEMENTS: Runner/Runner.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: Runner/Runner-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks
    dependencies:
      - target: PacketTunnel
        embed: true
      - sdk: NetworkExtension.framework
    preBuildScripts:
      - name: Flutter Build
        script: /bin/sh "$FLUTTER_ROOT/packages/flutter_tools/bin/xcode_backend.sh" build
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Embed Flutter
        script: /bin/sh "$FLUTTER_ROOT/packages/flutter_tools/bin/xcode_backend.sh" embed_and_thin
        basedOnDependencyAnalysis: false
  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
        excludes: ['Info.plist', '*.entitlements']
      - Shared
    configFiles:
      Debug: Flutter/Generated.xcconfig
      Profile: Flutter/Generated.xcconfig
      Release: Flutter/Generated.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FLCLASH_BUNDLE_ID).PacketTunnel
        INFOPLIST_FILE: PacketTunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: PacketTunnel/PacketTunnel.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: PacketTunnel/PacketTunnel-Bridging-Header.h
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks @executable_path/../../Frameworks
    dependencies:
      - sdk: NetworkExtension.framework
schemes:
  Runner:
    build:
      targets:
        Runner: all
    run:
      config: Debug
    profile:
      config: Profile
    archive:
      config: Release
